<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thermo3D: a 3D temperature converter for Celsius, Fahrenheit, Kelvin and Rankine with a live thermometer.">
<title>Thermo3D — 3D Temperature Converter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--h:200;--tx:#17203a;--mut:#4d5878;--glass:rgba(255,255,255,.62);--bd:rgba(20,30,80,.16);--in:rgba(255,255,255,.7);--bgl:90%;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f1f4ff;--mut:#a9b3d6;--glass:rgba(12,16,34,.55);--bd:rgba(255,255,255,.15);--in:rgba(255,255,255,.07);--bgl:9%;color-scheme:dark}}
:root[data-theme="dark"]{--tx:#f1f4ff;--mut:#a9b3d6;--glass:rgba(12,16,34,.55);--bd:rgba(255,255,255,.15);--in:rgba(255,255,255,.07);--bgl:9%;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(circle at 25% 45%,hsl(var(--h) 75% calc(var(--bgl) + 14%)),hsl(calc(var(--h) + 35) 60% var(--bgl)));background-attachment:fixed}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;display:flex;justify-content:flex-end;padding:24px 5vw}
.panel{width:min(560px,100%);background:var(--glass);border:1px solid var(--bd);border-radius:24px;padding:26px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotateX(12deg)}}
@media(max-width:820px){.wrap{padding-top:40vh}}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:28px;letter-spacing:-.02em}h1 span{color:hsl(var(--h) 90% 55%)}
.sub{color:var(--mut);margin:4px 0 16px;font-size:14px}
button,input,select{font:inherit;color:var(--tx)}
.ic{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:6px 11px;cursor:pointer}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge{padding:6px 12px;border-radius:999px;font-size:13px;background:var(--in);border:1px solid var(--bd);transition:all .4s}
.badge.main{background:hsl(var(--h) 80% 50% / .22);border-color:hsl(var(--h) 80% 50% / .6);font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fields{grid-template-columns:1fr}}
.f{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;transition:transform .25s,border-color .25s;transform-style:preserve-3d}
.f:focus-within,.f:hover{transform:translateY(-3px) perspective(500px) rotateX(4deg);border-color:hsl(var(--h) 85% 55%)}
.f label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.f .r{display:flex;align-items:center;gap:6px}
.f input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font-size:24px;font-weight:700;padding:4px 0}
.f .u{color:var(--mut);font-weight:600}
.cp{background:none;border:0;cursor:pointer;font-size:12px;color:var(--mut);padding:2px 4px}.cp:hover{color:var(--tx)}
.err{min-height:20px;color:#ff5d6c;font-size:13px;margin:8px 2px 0}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:hsl(var(--h) 85% 55%)}
.lbl{font-size:12px;color:var(--mut);margin-top:12px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--in);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:transform .2s}
.chip:hover{transform:translateY(-2px) scale(1.05);border-color:hsl(var(--h) 85% 55%)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{background:hsl(var(--h) 85% 50%);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px hsl(var(--h) 85% 50% / .5)}
.btn.g{background:var(--in);border:1px solid var(--bd);color:var(--tx)}
select{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px}
select option{color:#111}
.hist{display:grid;gap:6px;margin-top:8px;max-height:170px;overflow:auto}
.hist button{text-align:left;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}
.hist button:hover{border-color:hsl(var(--h) 85% 55%)}
.empty{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#111;color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:all .3s;z-index:9;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.panel{animation:none}*{transition:none!important}}
</style>
<script>window.va=window.va||function(){(window.va.q=window.va.q||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap"><main class="panel">
  <header><h1>Thermo<span>3D</span></h1><button class="ic" id="theme" aria-label="Toggle theme">◐</button></header>
  <p class="sub">Type in any box and the others update instantly. Watch the thermometer respond.</p>
  <div class="badges"><span class="badge main" id="feel">—</span><span class="badge" id="water">—</span></div>
  <div class="fields" id="fields"></div>
  <div class="err" id="err" role="alert" aria-live="polite"></div>
  <div class="lbl"><span>Temperature slider (−50 to 150 °C)</span><span id="sv"></span></div>
  <input type="range" id="slider" min="-50" max="150" step="0.5" value="20" aria-label="Temperature slider in Celsius">
  <div class="lbl"><span>Quick presets</span></div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <label style="font-size:13px;color:var(--mut)">Decimals <select id="prec"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
    <button class="btn" id="save">Save</button><button class="btn g" id="clear">Clear all</button>
  </div>
  <div class="lbl"><span>History</span><button class="cp" id="clh">Clear history</button></div>
  <div class="hist" id="hist"></div>
</main></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
/* ---------- conversion core (everything routes through Celsius) ---------- */
const U={
 c:{n:'Celsius',s:'°C',to:v=>v,from:c=>c},
 f:{n:'Fahrenheit',s:'°F',to:v=>(v-32)*5/9,from:c=>c*9/5+32},
 k:{n:'Kelvin',s:'K',to:v=>v-273.15,from:c=>c+273.15},
 r:{n:'Rankine',s:'°R',to:v=>(v-491.67)*5/9,from:c=>(c+273.15)*9/5}
};
const ABS=-273.15,inp={};let cur=20,hist=[];
const fmt=x=>String(parseFloat(x.toFixed(+$('prec').value)));
$('fields').innerHTML=Object.keys(U).map(k=>`<div class="f"><label for="i${k}"><span>${U[k].n}</span><button class="cp" data-k="${k}" aria-label="Copy ${U[k].n}">Copy</button></label><div class="r"><input id="i${k}" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span class="u">${U[k].s}</span></div></div>`).join('');
Object.keys(U).forEach(k=>inp[k]=$('i'+k));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1400)}
function feel(c){
 if(c<-40)return'🥶 Dangerously cold';if(c<0)return'❄️ Freezing';if(c<10)return'🧥 Cold';if(c<18)return'🍃 Cool';
 if(c<26)return'😊 Comfortable';if(c<33)return'☀️ Warm';if(c<42)return'🔥 Hot';return'🌋 Extreme heat'}
function water(c){const e=.005;
 if(Math.abs(c)<e)return'💧 Melting point of ice';if(Math.abs(c-100)<e)return'♨️ Boiling point of water';
 return c<0?'🧊 Water is solid ice':c<100?'💧 Water is liquid':'☁️ Water is steam'}
function setAll(c,except){
 cur=c;Object.keys(U).forEach(k=>{if(k!==except)inp[k].value=fmt(U[k].from(c))});
 $('slider').value=clamp(c,-50,150);$('sv').textContent=fmt(c)+' °C';
 $('feel').textContent=feel(c);$('water').textContent=water(c);
}
document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.k;if(!k||e.target.tagName!=='INPUT')return;
 const v=e.target.value.trim().replace(',','.');
 if(v===''){Object.keys(U).forEach(x=>{if(x!==k)inp[x].value=''});$('err').textContent='';return}
 if(!/^-?\d*\.?\d*$/.test(v)){$('err').textContent='Please enter a number.';return}
 const n=parseFloat(v);if(isNaN(n))return;
 const c=U[k].to(n);
 if(c<ABS-1e-9){$('err').textContent='Below absolute zero (−273.15 °C). That isn’t physically possible.';return}
 $('err').textContent='';setAll(c,k);
});
$('slider').oninput=e=>{$('err').textContent='';setAll(+e.target.value)};
$('prec').onchange=()=>setAll(cur);
const PRE=[['Absolute zero',ABS],['Freezing',0],['Fridge',4],['Room',22],['Body',37],['Boiling',100],['Oven',180]];
$('chips').innerHTML=PRE.map((p,i)=>`<button class="chip" data-p="${i}">${p[0]}</button>`).join('');
$('chips').onclick=e=>{const i=e.target.dataset.p;if(i!==undefined){$('err').textContent='';setAll(PRE[i][1])}};
document.addEventListener('click',e=>{
 const k=e.target.dataset&&e.target.dataset.k;
 if(k&&e.target.classList.contains('cp')){const t=inp[k].value;if(!t)return;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{inp[k].select();try{document.execCommand('copy')}catch(_){}}).finally(()=>toast('Copied '+t+' '+U[k].s))}
});
$('clear').onclick=()=>{Object.keys(U).forEach(k=>inp[k].value='');$('err').textContent='';inp.c.focus()};
/* history */
try{hist=JSON.parse(localStorage.getItem('thermo3d')||'[]')}catch(e){}
function drawHist(){
 $('hist').innerHTML=hist.length?hist.map((c,i)=>`<button data-h="${i}">${fmt(c)} °C = ${fmt(U.f.from(c))} °F = ${fmt(U.k.from(c))} K</button>`).join(''):'<span class="empty">Nothing saved yet. Press Save to keep a conversion.</span>'}
$('save').onclick=()=>{if(inp.c.value==='')return;hist=[cur,...hist.filter(x=>x!==cur)].slice(0,8);try{localStorage.setItem('thermo3d',JSON.stringify(hist))}catch(e){}drawHist();toast('Saved')};
$('hist').onclick=e=>{const i=e.target.dataset.h;if(i!==undefined)setAll(hist[i])};
$('clh').onclick=()=>{hist=[];try{localStorage.removeItem('thermo3d')}catch(e){}drawHist()};
$('theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};
drawHist();setAll(20);

/* ---------- 3D thermometer scene ---------- */
const hueFor=c=>215-clamp((c+20)/80,0,1)*215;
let tc=cur;
(function(){
 if(!window.THREE)return;let r;
 try{r=new THREE.WebGLRenderer({canvas:$('bg'),antialias:true,alpha:true})}catch(e){$('bg').style.display='none';return}
 r.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.set(0,0,13);
 sc.add(new THREE.AmbientLight(0xffffff,.7));
 const l1=new THREE.PointLight(0xffffff,1.1);l1.position.set(5,5,8);sc.add(l1);
 const l2=new THREE.PointLight(0x66aaff,1.4,30);l2.position.set(-5,-2,5);sc.add(l2);
 const g=new THREE.Group();sc.add(g);
 const tube=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,6.4,40,1,true),new THREE.MeshPhongMaterial({color:0xcfe8ff,transparent:true,opacity:.25,shininess:140,side:THREE.DoubleSide}));
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.4,32,16,0,Math.PI*2,0,Math.PI/2),tube.material);cap.position.y=3.2;
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.85,40,32),tube.material);bulb.position.y=-3.5;
 const hgM=new THREE.MeshPhongMaterial({color:0x3aa0ff,emissive:0x112244,shininess:90});
 const hg=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,1,24),hgM);hg.geometry.translate(0,.5,0);hg.position.y=-3.4;
 const core=new THREE.Mesh(new THREE.SphereGeometry(.62,32,24),hgM);core.position.y=-3.5;
 g.add(tube,cap,bulb,hg,core);
 const tm=new THREE.MeshBasicMaterial({color:0x9aa8d8});
 for(let i=0;i<=20;i++){const big=i%5===0,m=new THREE.Mesh(new THREE.BoxGeometry(big?.38:.2,.03,.03),tm);m.position.set(.65+(big?.1:0),-2.6+i*.28,0);g.add(m)}
 const rings=[0,1].map(i=>{const t=new THREE.Mesh(new THREE.TorusGeometry(2.4+i*.5,.015,8,100),new THREE.MeshBasicMaterial({color:0x8fa4ff,transparent:true,opacity:.45}));g.add(t);return t});
 const N=500,P=new Float32Array(N*3);for(let i=0;i<N;i++){P[i*3]=(Math.random()-.5)*24;P[i*3+1]=(Math.random()-.5)*16;P[i*3+2]=(Math.random()-.5)*10-2}
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(P,3));
 const pm=new THREE.PointsMaterial({size:.11,transparent:true,opacity:.85,color:0xbfe6ff,depthWrite:false});sc.add(new THREE.Points(pg,pm));
 let mx=0;addEventListener('pointermove',e=>mx=e.clientX/innerWidth-.5);
 const wide=()=>innerWidth>820;
 function rs(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  g.position.set(wide()?-3.6:0,wide()?0:2.6,0);g.scale.setScalar(wide()?1:.62)}
 addEventListener('resize',rs);rs();
 const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;let t=0,lastH=-99;
 const colA=new THREE.Color(),colB=new THREE.Color(0xbfe6ff),colC=new THREE.Color(0xffa040);
 (function loop(){requestAnimationFrame(loop);t+=calm?0:.01;
  tc+=(cur-tc)*.06;
  const hue=hueFor(tc),lvl=clamp((tc+50)/200,0,1);
  hg.scale.y=.2+lvl*6;
  colA.setHSL(hue/360,.9,.55);hgM.color.copy(colA);hgM.emissive.setHSL(hue/360,.9,.18);l2.color.copy(colA);
  pm.color.copy(colB).lerp(colC,clamp((tc-5)/40,0,1));
  if(Math.abs(hue-lastH)>.4){lastH=hue;document.documentElement.style.setProperty('--h',hue.toFixed(1))}
  const v=clamp((tc-18)/40,-1,1)*.035;
  for(let i=0;i<N;i++){const a=i*3;P[a+1]+=v+(v?0:-.004);P[a]+=Math.sin(t*2+i)*.002;if(P[a+1]>8)P[a+1]=-8;if(P[a+1]<-8)P[a+1]=8}
  pg.attributes.position.needsUpdate=true;
  g.rotation.y=Math.sin(t*.6)*.5+mx*.8;rings.forEach((m,i)=>{m.rotation.x=1.2+t*(.5+i*.3);m.rotation.y=t*.4});
  r.render(sc,cam)})();
})();
</script>
</body>
</html>
